name: LAB-5 create backlog board
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create GitHub Project + issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python lab5/create_board.py
